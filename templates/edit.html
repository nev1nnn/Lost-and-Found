<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ item['item_name'] }} | CampusFind</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 6px;
            color: #334155;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        .form-control:focus {
            border-color: #009ca6;
            box-shadow: 0 0 0 3px rgba(0, 156, 166, 0.15);
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">
                <div class="campus-brand">
                    <span class="campus-name">CampusFind</span>
                    <span class="campus-subtitle">REVA University</span>
                </div>
            </a>

            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/post" class="nav-button">+ Post Item</a>
            </div>
        </div>
    </nav>

    <main class="details-page">
        <a href="/item/{{ item['id'] }}" class="back-link">← Cancel and back to item</a>

        <div class="edit-card">
            <h1 style="font-size: 1.75rem; font-weight: 900; margin-bottom: 24px;">Edit Listing</h1>

            <form method="POST">
                <div class="form-group">
                    <label>Listing Type</label>
                    <div style="display: flex; gap: 20px;">
                        <label style="font-weight: 600; cursor: pointer;">
                            <input type="radio" name="type" value="lost" {% if item['type'] == 'lost' %}checked{% endif %}> 🔴 Lost Item
                        </label>
                        <label style="font-weight: 600; cursor: pointer;">
                            <input type="radio" name="type" value="found" {% if item['type'] == 'found' %}checked{% endif %}> 🟢 Found Item
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="item_name">Item Name</label>
                    <input type="text" id="item_name" name="item_name" class="form-control" value="{{ item['item_name'] }}" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-control" required>
                        <option value="electronics" {% if item['category'] == 'electronics' %}selected{% endif %}>Electronics</option>
                        <option value="books" {% if item['category'] == 'books' %}selected{% endif %}>Books</option>
                        <option value="documents" {% if item['category'] == 'documents' %}selected{% endif %}>Documents</option>
                        <option value="accessories" {% if item['category'] == 'accessories' %}selected{% endif %}>Accessories</option>
                        <option value="clothing" {% if item['category'] == 'clothing' %}selected{% endif %}>Clothing</option>
                        <option value="other" {% if item['category'] == 'other' %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" class="form-control" value="{{ item['location'] }}" required>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-control" value="{{ item['date'] }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" class="form-control" rows="4" required>{{ item['description'] }}</textarea>
                </div>

                <div class="form-group">
                    <label for="contact">Contact Information</label>
                    <input type="text" id="contact" name="contact" class="form-control" value="{{ item['contact'] }}" required>
                </div>

                <button type="submit" class="submit-button" style="margin-top: 10px;">Save Changes</button>
            </form>
        </div>
    </main>

    <footer>
        <p>CampusFind · REVA University © 2026</p>
    </footer>

</body>

</html>
