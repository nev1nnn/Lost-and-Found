<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CampusFind | REVA University Lost & Found{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('home') }}" class="brand-logo">
                <span class="logo-badge">REVA</span> CampusFind
            </a>
            <div class="nav-links">
                <a href="{{ url_for('home') }}" class="nav-item">All Listings</a>
                <a href="{{ url_for('post_item') }}" class="nav-btn">+ Report Item</a>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; CampusFind — Official Lost & Found Portal for REVA University Campus.</p>
        </div>
    </footer>

</body>
</html>
